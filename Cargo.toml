[package]
name = "explicrate"
version = "0.1.0"
edition = "2021"
description = "Look up a crate by name: what it does, downloads/stars rank within its year, and mentions in This Week in Rust, Scientific Computing in Rust and blessed.rs"
license = "MIT"
readme = "README.md"
keywords = ["crates", "discovery", "cli", "lookup", "ecosystem"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["OPENING.md", "deploy/", "DEPLOY.md", "Dockerfile", ".dockerignore", "cache/"]

[dependencies]
ureq = { version = "2", features = ["json"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
flate2 = "1"
tar = "0.4"
csv = "1"
